title: Post Quality Manager
description: Score every post, see what to fix next and keep your back-catalog sharp. AI content reviews, stored and tracked in WP Admin.
# The home page's <title> is "title | tagline" (jekyll-seo-tag); the footer and the sharing card carry the description.
tagline: AI content reviews for WordPress
url: https://postquality.com
author: Vincent Heimann
email: hello@postquality.com
# The site's own layouts (_layouts/, _includes/, assets/css/site.css). GitHub Pages
# falls back to jekyll-theme-primer when no theme is named; null switches that off.
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Launch state (one flag, see README). Before launch every action is the interest
# email; at the release set launched: true and fill the five values below.
launched: false
version: ""
version_date: ""
tested_up_to: ""
wporg_url: ""
changelog_url: ""

# Every page shares the sharing card (assets/og-card.png, source _tools/og-card.html; README). jekyll-seo-tag turns it
# into og:image, twitter:image and twitter:card summary_large_image; _includes/head.html adds its size and alt text.
# Each page's own one-sentence description: lives in its front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-card.png

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
