<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-brand">
        {% include lockup.html variant="d" tile=20 %}
        <p class="footer-tagline">{{ site.description }}</p>
      </div>
      <div class="footer-contact">
        <nav class="footer-nav" aria-label="Policies">
          <ul role="list">
            <li><a href="{{ "/privacy/" | relative_url }}">Privacy</a></li>
            <li><a href="{{ "/terms/" | relative_url }}">Terms</a></li>
            <li><a href="{{ "/refund/" | relative_url }}">Refund</a></li>
            <li><a href="{{ "/support/" | relative_url }}">Support</a></li>
          </ul>
        </nav>
        <p class="footer-mail"><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
      </div>
    </div>
    <div class="footer-legal">
      <p>No cookies, no analytics. Hosted on GitHub Pages.</p>
      <p>© 2026 Vincent Heimann · GPL-2.0-or-later</p>
    </div>
    {% include signature.html %}
  </div>
</footer>
